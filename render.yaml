# Render.com deployment configuration
services:
  # Backend API
  - type: web
    name: reconciliation-backend
    env: python
    region: oregon
    buildCommand: cd backend && pip install -r requirements.txt && pip install gunicorn
    startCommand: cd backend && gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GOOGLE_CREDENTIALS_PATH
        sync: false # You'll set this in Render dashboard

  # Frontend (optional - can use Vercel/Netlify instead)
  - type: web
    name: reconciliation-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
